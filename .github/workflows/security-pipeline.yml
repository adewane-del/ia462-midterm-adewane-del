name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit pinned requirements
        run: python -m pip_audit -r midterm/requirements.txt

      - name: Audit hashed lockfile
        run: python -m pip_audit --no-deps -r midterm/requirements.lock

  container-security:
    name: Docker Security and SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build hardened Docker image
        run: docker build -t ia462-midterm:ci midterm/app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ia462-midterm:ci
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Generate Syft SPDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ia462-midterm:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Verify generated SBOM
        run: |
          test -s sbom.spdx.json
          echo "PASS: Syft SBOM generated"
          ls -lh sbom.spdx.json
